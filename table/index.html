<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Table</title>
  </head>
  <body>
    <table>
      <caption>
        Concerts
      </caption>
      <tr>
        <thead>
          <th scope="col">Artist</th>
          <th scope="col">Location</th>
          <th scope="col">Cost</th>
        </thead>
      </tr>
      <tbody>
        <tr>
          <td>Justin</td>
          <td>Australia</td>
          <td>$20</td>
        </tr>
        <tr>
          <td>Martin</td>
          <td>Spain</td>
          <td>$40</td>
        </tr>
        <tr>
          <td>Skylar</td>
          <td>Germany</td>
          <td>$60</td>
        </tr>
        <tr>
          <td>Zara</td>
          <td>Norway</td>
          <td>$20</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">Sum</td>
          <td>$140</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>

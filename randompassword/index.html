<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Random Password Generator</title>
  </head>
  <body>
    <div class="card">
      <nav>
        <label for="theme-switch">Light Mode</label>
        <input type="checkbox" role="switch" id="theme-switch" />
      </nav>
      <div class="container">
        <div class="header">
          <h1>Generate a <span id="flavoured-header">random password</span></h1>
          <p id="subheading-text">Never use an insecure password again.</p>
        </div>
        <button id="generate-password-btn" type="button">
          Generate passwords
        </button>
        <p id="copy-password-status"></p>
        <div id="passwords">
          <div id="password-container"></div>
        </div>
      </div>
    </div>
    <div class="options">
      <label for="password-length">Password Length</label>
      <input
        type="number"
        min="1"
        value="1"
        placeholder="Password Length"
        id="password-length"
        name="password-length"
      />
      <label for="number-of-passwords">Num of Passwords</label>
      <input
        type="number"
        placeholder="Number of Passwords"
        id="number-of-passwords"
        name="number-of-passwords"
      />
      <div class="filters">
        <button type="button" class="filter-btn active" id="uppercase-btn">
          Uppercase
        </button>
        <button type="button" class="filter-btn active" id="lowercase-btn">
          Lowercase
        </button>
        <button type="button" class="filter-btn active" id="numbers-btn">
          Numbers
        </button>
        <button type="button" class="filter-btn active" id="symbols-btn">
          Symbols
        </button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
